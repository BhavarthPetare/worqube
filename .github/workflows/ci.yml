name: CI

# Runs the README quickstart on a fresh runner, so the README is tested, not trusted.
on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm run install:all
      - name: Build client
        run: npm run build --prefix client
      - name: Test
        run: npm test
      - name: Demo starts and answers
        run: |
          npm run dev:demo > demo.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:5000/api/health && exit 0
            sleep 2
          done
          cat demo.log
          exit 1
