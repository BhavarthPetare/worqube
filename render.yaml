# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service serves the API and the built React client.
services:
  - type: web
    name: worqube
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      # Set in the Render dashboard (never committed): your MongoDB Atlas connection string.
      - key: MONGO_URI
        sync: false
